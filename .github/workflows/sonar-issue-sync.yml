name: Reusable Sonar Issue Sync Workflow

on:
  workflow_call:
    inputs:
      sonar_project_key:
        description: "SonarQube project key"
        required: true
        type: string
      sonar_organization:
        description: "SonarQube Cloud organization key"
        required: false
        default: "gameframex"
        type: string
      sonar_host_url:
        description: "SonarQube host URL"
        required: false
        default: "https://sonarcloud.io"
        type: string
      sonar_branch:
        description: "SonarQube branch"
        required: false
        default: "main"
        type: string
      sonar_severities:
        description: "Comma-separated SonarQube severities to sync"
        required: false
        default: "BLOCKER,CRITICAL"
        type: string
      github_repository:
        description: "GitHub repository in owner/name format"
        required: false
        default: ""
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  issues: write
  contents: read

jobs:
  sync-sonar-issues:
    name: sync-sonar-issues
    runs-on: ubuntu-latest
    steps:
      - name: Sync BLOCKER/CRITICAL and vulnerabilities
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_BRANCH: ${{ inputs.sonar_branch }}
          SONAR_SEVERITIES: ${{ inputs.sonar_severities }}
          GH_REPOSITORY: ${{ inputs.github_repository || github.repository }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          sonar_token = os.environ["SONAR_TOKEN"]
          gh_token = os.environ["GH_TOKEN"]
          sonar_host = os.environ.get("SONAR_HOST_URL", "https://sonarcloud.io").rstrip("/")
          sonar_org = os.environ.get("SONAR_ORGANIZATION", "gameframex")
          project_key = os.environ["SONAR_PROJECT_KEY"]
          branch = os.environ.get("SONAR_BRANCH", "main")
          query_branch = "" if branch in ("", "main") else branch
          severity_filter = os.environ.get("SONAR_SEVERITIES", "BLOCKER,CRITICAL")
          repository = os.environ["GH_REPOSITORY"]
          repository_name = repository.rsplit("/", 1)[-1].lower()
          project_label = f"project:{repository_name}"
          allowed_severities = {"BLOCKER", "CRITICAL", "MAJOR", "MINOR", "INFO"}

          file_marker_re = re.compile(r"<!--\s*sonar-issue-file:\s*([^>]+?)\s*-->")
          legacy_marker_re = re.compile(r"<!--\s*sonar-issue-key:\s*([A-Za-z0-9_-]+)\s*-->")
          visible_file_re = re.compile(r"^File:\s*`([^`]+)`$", re.MULTILINE)
          project_marker = f"<!-- sonar-project-key: {project_key} -->"
          label_specs = {
              "sonar": "5319e7",
              "sonar:grouped": "5319e7",
              "sonar:blocker": "b60205",
              "sonar:critical": "d93f0b",
              "sonar:vulnerability": "c44536",
              project_label: "0e8a16",
          }
          max_body_issues = 80

          def request_json(method, url, headers=None, data=None, retry=True):
              payload = None
              if data is not None:
                  payload = json.dumps(data).encode("utf-8")
              req_headers = {"Accept": "application/json"}
              if payload is not None:
                  req_headers["Content-Type"] = "application/json"
              if headers:
                  req_headers.update(headers)
              req = urllib.request.Request(url, data=payload, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if retry and exc.code == 429:
                      wait_seconds = int(exc.headers.get("Retry-After", "60"))
                      time.sleep(wait_seconds)
                      return request_json(method, url, headers, data, retry=False)
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} failed with HTTP {exc.code}: {detail}") from exc

          def sonar_search(extra_params):
              issues = {}
              page = 1
              while True:
                  params = {
                      "organization": sonar_org,
                      "componentKeys": project_key,
                      "statuses": "OPEN,CONFIRMED,REOPENED",
                      "ps": "500",
                      "p": str(page),
                  }
                  if query_branch:
                      params["branch"] = query_branch
                  params.update(extra_params)
                  url = f"{sonar_host}/api/issues/search?{urllib.parse.urlencode(params)}"
                  data = request_json(
                      "GET",
                      url,
                      headers={"Authorization": f"Bearer {sonar_token}"},
                  )
                  for issue in data.get("issues", []):
                      issues[issue["key"]] = issue
                  total = int(data.get("total", 0))
                  page_size = int(data.get("ps", 500))
                  if page * page_size >= total:
                      break
                  page += 1
              return issues

          def gh_api(method, path, data=None):
              url = f"https://api.github.com{path}"
              return request_json(
                  method,
                  url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  data=data,
              )

          def ensure_label(name, color):
              encoded = urllib.parse.quote(name, safe="")
              try:
                  gh_api("GET", f"/repos/{repository}/labels/{encoded}")
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise
                  gh_api("POST", f"/repos/{repository}/labels", {
                      "name": name,
                      "color": color,
                      "description": "Synced from SonarQube Cloud",
                  })

          def list_open_sonar_issues():
              files = {}
              legacy_keys = {}
              page = 1
              while True:
                  params = urllib.parse.urlencode({
                      "state": "open",
                      "labels": "sonar",
                      "per_page": "100",
                      "page": str(page),
                  })
                  items = gh_api("GET", f"/repos/{repository}/issues?{params}")
                  if not items:
                      break
                  for item in items:
                      if "pull_request" in item:
                          continue
                      body = item.get("body") or ""
                      file_match = file_marker_re.search(body) or visible_file_re.search(body)
                      if file_match:
                          files.setdefault(file_match.group(1), []).append(item)
                      legacy_match = legacy_marker_re.search(body)
                      if legacy_match:
                          legacy_keys[legacy_match.group(1)] = item
                  page += 1
              return files, legacy_keys

          def sonar_issue_url(key):
              query = urllib.parse.urlencode({"open": key, "id": project_key})
              return f"{sonar_host}/project/issues?{query}"

          def normalize_severities(value):
              items = [item.strip().upper() for item in value.split(",") if item.strip()]
              invalid = sorted(set(items) - allowed_severities)
              if invalid:
                  raise ValueError(f"Unsupported Sonar severities: {', '.join(invalid)}")
              return ",".join(dict.fromkeys(items)) if items else "BLOCKER,CRITICAL"

          def component_path(issue):
              component = issue.get("component", "")
              prefix = f"{project_key}:"
              if component.startswith(prefix):
                  return component[len(prefix):]
              if ":" in component:
                  return component.split(":", 1)[1]
              return component or "unknown-location"

          def group_key_for(issue):
              # ponytail: group by file; upgrade to root-cause grouping when a reliable dependency graph is available.
              raw = f"{project_key}|{branch}|{component_path(issue)}"
              return f"file:{hashlib.sha1(raw.encode('utf-8')).hexdigest()[:16]}"

          def group_sonar_issues(issues):
              groups = {}
              for issue in issues.values():
                  key = group_key_for(issue)
                  group = groups.setdefault(key, {
                      "key": key,
                      "path": component_path(issue),
                      "issues": [],
                  })
                  group["issues"].append(issue)
              for group in groups.values():
                  group["issues"].sort(key=lambda item: (
                      component_path(item),
                      int(item.get("line") or 0),
                      item.get("rule") or "",
                      item["key"],
                  ))
              return groups

          def group_labels(group):
              labels = ["sonar", "sonar:grouped", project_label]
              severities = {(issue.get("severity") or "").lower() for issue in group["issues"]}
              issue_types = {(issue.get("type") or "").lower() for issue in group["issues"]}
              if "blocker" in severities:
                  labels.append("sonar:blocker")
              if "critical" in severities:
                  labels.append("sonar:critical")
              if "vulnerability" in issue_types:
                  labels.append("sonar:vulnerability")
              return labels

          def priority_prefix(group):
              severities = {(issue.get("severity") or "").upper() for issue in group["issues"]}
              issue_types = {(issue.get("type") or "").upper() for issue in group["issues"]}
              if "VULNERABILITY" in issue_types or "BLOCKER" in severities:
                  return "P0"
              if "CRITICAL" in severities:
                  return "P1"
              return "P2"

          def group_title(group):
              path = group["path"]
              count = len(group["issues"])
              title = f"{priority_prefix(group)} [Sonar] Fix {path} ({count} issue{'s' if count != 1 else ''})"
              return title[:240]

          def group_body(group):
              issues = group["issues"]
              keys = [issue["key"] for issue in issues]
              severities = sorted({issue.get("severity", "UNKNOWN") for issue in issues})
              issue_types = sorted({issue.get("type", "UNKNOWN") for issue in issues})
              rules = sorted({issue.get("rule", "UNKNOWN") for issue in issues})
              fields = [
                  f"<!-- sonar-issue-group: {group['key']} -->",
                  f"<!-- sonar-issue-file: {group['path']} -->",
                  project_marker,
                  f"<!-- sonar-issue-keys: {','.join(keys)} -->",
                  "",
                  "This GitHub Issue groups current SonarQube Cloud findings for one file so the file can be fixed in a single pass.",
                  "",
                  f"Project: `{project_key}`",
                  f"Branch: `{branch}`",
                  f"File: `{group['path']}`",
                  f"Group: `file`",
                  f"Count: `{len(issues)}`",
                  f"Severities: `{', '.join(severities)}`",
                  f"Types: `{', '.join(issue_types)}`",
                  f"Rules: `{', '.join(rules)}`",
                  "",
                  "Findings:",
              ]
              for issue in issues[:max_body_issues]:
                  line = issue.get("line")
                  location = f"{group['path']}:{line}" if line else group["path"]
                  message = (issue.get("message") or "").replace("\n", " ")
                  fields.append(
                      f"- [{issue['key']}]({sonar_issue_url(issue['key'])}) - "
                      f"`{issue.get('severity', 'UNKNOWN')}/{issue.get('type', 'UNKNOWN')}` - "
                      f"`{issue.get('rule', 'UNKNOWN')}` - `{location}` - {message}"
                  )
              hidden_count = len(issues) - max_body_issues
              if hidden_count > 0:
                  fields.extend([
                      "",
                      f"{hidden_count} additional finding(s) are still tracked in the hidden sonar-issue-keys marker above.",
                  ])
              fields.extend([
                  "",
                  "Acceptance:",
                  "- Fix all listed current Sonar findings in this file.",
                  "- Keep the existing public API unchanged unless the finding requires a contract change.",
                  "- Rerun the repository quality workflow and verify Sonar no longer reports these keys.",
              ])
              return "\n".join(fields)

          def desired_labels_for(gh_issue, sonar_labels):
              current_labels = sorted(label["name"] for label in gh_issue.get("labels", []))
              preserved_labels = [
                  name for name in current_labels
                  if not name.startswith("sonar") and not name.startswith("project:")
              ]
              return sorted(set(sonar_labels + preserved_labels))

          def update_issue_if_needed(gh_issue, title, body, labels):
              current_labels = sorted(label["name"] for label in gh_issue.get("labels", []))
              if gh_issue.get("title") == title and (gh_issue.get("body") or "") == body and current_labels == labels:
                  return False
              gh_api("PATCH", f"/repos/{repository}/issues/{gh_issue['number']}", {
                  "title": title,
                  "body": body,
                  "labels": labels,
              })
              return True

          def close_issue(gh_issue):
              gh_api("PATCH", f"/repos/{repository}/issues/{gh_issue['number']}", {"state": "closed"})

          def run_self_test():
              sample = {
                  "A": {
                      "key": "A",
                      "component": f"{project_key}:src/Foo.cs",
                      "line": 10,
                      "severity": "CRITICAL",
                      "type": "CODE_SMELL",
                      "rule": "csharpsquid:S1",
                      "message": "First",
                  },
                  "B": {
                      "key": "B",
                      "component": f"{project_key}:src/Foo.cs",
                      "line": 20,
                      "severity": "BLOCKER",
                      "type": "BUG",
                      "rule": "csharpsquid:S2",
                      "message": "Second",
                  },
                  "C": {
                      "key": "C",
                      "component": f"{project_key}:src/Foo.cs",
                      "line": 30,
                      "severity": "CRITICAL",
                      "type": "VULNERABILITY",
                      "rule": "csharpsquid:S3",
                      "message": "Third",
                  },
              }
              groups = group_sonar_issues(sample)
              assert len(groups) == 1, groups
              only = next(iter(groups.values()))
              assert len(only["issues"]) == 3, only
              assert group_title(only).startswith("P0 [Sonar]"), group_title(only)
              assert "sonar:vulnerability" in group_labels(only), group_labels(only)
              assert project_label == "project:repo"
              assert project_label in group_labels(only), group_labels(only)
              assert desired_labels_for({"labels": [{"name": "project:old"}, {"name": "manual"}]}, group_labels(only)) == sorted(set(group_labels(only) + ["manual"]))
              assert normalize_severities("") == "BLOCKER,CRITICAL"
              assert normalize_severities(" critical, major,critical ") == "CRITICAL,MAJOR"

          if os.environ.get("SONAR_ISSUE_SYNC_SELF_TEST") == "1":
              run_self_test()
              print("Sonar issue grouping self-test passed")
              raise SystemExit(0)

          severities = normalize_severities(severity_filter)
          severity_issues = sonar_search({"severities": severities})
          vulnerabilities = sonar_search({"types": "VULNERABILITY"})
          current = {**severity_issues, **vulnerabilities}
          current_groups = group_sonar_issues(current)
          current_keys = set(current)

          for name, color in label_specs.items():
              ensure_label(name, color)

          existing_files, legacy_issues = list_open_sonar_issues()
          current_file_paths = {group["path"] for group in current_groups.values()}
          used_issue_numbers = set()
          created = updated = closed = unchanged = closed_superseded = 0

          for group_key, group in sorted(current_groups.items(), key=lambda item: item[1]["path"]):
              title = group_title(group)
              body = group_body(group)
              labels = group_labels(group)
              candidates = []
              if group["path"] in existing_files:
                  candidates.extend(existing_files[group["path"]])
              for issue in group["issues"]:
                  legacy_issue = legacy_issues.get(issue["key"])
                  if legacy_issue:
                      candidates.append(legacy_issue)

              unique_candidates = {candidate["number"]: candidate for candidate in candidates}
              if unique_candidates:
                  gh_issue = unique_candidates[min(unique_candidates)]
                  used_issue_numbers.add(gh_issue["number"])
                  desired_labels = desired_labels_for(gh_issue, labels)
                  if update_issue_if_needed(gh_issue, title, body, desired_labels):
                      updated += 1
                  else:
                      unchanged += 1
                  for number, duplicate in sorted(unique_candidates.items()):
                      if number == gh_issue["number"]:
                          continue
                      close_issue(duplicate)
                      used_issue_numbers.add(number)
                      closed_superseded += 1
              else:
                  gh_api("POST", f"/repos/{repository}/issues", {
                      "title": title,
                      "body": body,
                      "labels": labels,
                  })
                  created += 1

          for file_path, issues in sorted(existing_files.items()):
              if file_path in current_file_paths:
                  for gh_issue in issues:
                      if gh_issue["number"] in used_issue_numbers:
                          continue
                      comment = f"SonarQube Cloud still reports file `{file_path}` for project `{project_key}` on branch `{branch}`, but this issue is a duplicate. Closing it."
                      gh_api("POST", f"/repos/{repository}/issues/{gh_issue['number']}/comments", {"body": comment})
                      close_issue(gh_issue)
                      closed += 1
                  continue
              for gh_issue in issues:
                  if gh_issue["number"] in used_issue_numbers:
                      continue
                  comment = f"SonarQube Cloud no longer reports file `{file_path}` for project `{project_key}` on branch `{branch}`. Closing this synchronized issue."
                  gh_api("POST", f"/repos/{repository}/issues/{gh_issue['number']}/comments", {"body": comment})
                  close_issue(gh_issue)
                  closed += 1

          for key, gh_issue in sorted(legacy_issues.items()):
              if key in current_keys or gh_issue["number"] in used_issue_numbers:
                  continue
              comment = f"SonarQube Cloud no longer reports `{key}` for project `{project_key}` on branch `{branch}`. Closing this synchronized issue."
              gh_api("POST", f"/repos/{repository}/issues/{gh_issue['number']}/comments", {"body": comment})
              close_issue(gh_issue)
              closed += 1

          print(
              "Sonar issue sync complete: "
              f"created={created}, updated={updated}, unchanged={unchanged}, "
              f"closed={closed}, closed_superseded={closed_superseded}, "
              f"current={len(current)}, current_groups={len(current_groups)}"
          )
          PY
