name: Reusable Sonar Issue Sync Workflow

on:
  workflow_call:
    inputs:
      sonar_project_key:
        description: "SonarQube project key"
        required: true
        type: string
      sonar_organization:
        description: "SonarQube Cloud organization key"
        required: false
        default: "gameframex"
        type: string
      sonar_host_url:
        description: "SonarQube host URL"
        required: false
        default: "https://sonarcloud.io"
        type: string
      sonar_branch:
        description: "SonarQube branch"
        required: false
        default: "main"
        type: string
      github_repository:
        description: "GitHub repository in owner/name format"
        required: false
        default: ""
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  issues: write
  contents: read

jobs:
  sync-sonar-issues:
    name: sync-sonar-issues
    runs-on: ubuntu-latest
    steps:
      - name: Sync BLOCKER/CRITICAL and vulnerabilities
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_BRANCH: ${{ inputs.sonar_branch }}
          GH_REPOSITORY: ${{ inputs.github_repository || github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          sonar_token = os.environ["SONAR_TOKEN"]
          gh_token = os.environ["GH_TOKEN"]
          sonar_host = os.environ.get("SONAR_HOST_URL", "https://sonarcloud.io").rstrip("/")
          sonar_org = os.environ.get("SONAR_ORGANIZATION", "gameframex")
          project_key = os.environ["SONAR_PROJECT_KEY"]
          branch = os.environ.get("SONAR_BRANCH", "main")
          query_branch = "" if branch in ("", "main") else branch
          repository = os.environ["GH_REPOSITORY"]

          marker_re = re.compile(r"<!--\s*sonar-issue-key:\s*([A-Za-z0-9_-]+)\s*-->")
          project_marker = f"<!-- sonar-project-key: {project_key} -->"
          label_specs = {
              "sonar": "5319e7",
              "sonar:blocker": "b60205",
              "sonar:critical": "d93f0b",
              "sonar:vulnerability": "c44536",
          }

          def request_json(method, url, headers=None, data=None, retry=True):
              payload = None
              if data is not None:
                  payload = json.dumps(data).encode("utf-8")
              req_headers = {"Accept": "application/json"}
              if payload is not None:
                  req_headers["Content-Type"] = "application/json"
              if headers:
                  req_headers.update(headers)
              req = urllib.request.Request(url, data=payload, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if retry and exc.code == 429:
                      wait_seconds = int(exc.headers.get("Retry-After", "60"))
                      time.sleep(wait_seconds)
                      return request_json(method, url, headers, data, retry=False)
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} failed with HTTP {exc.code}: {detail}") from exc

          def sonar_search(extra_params):
              issues = {}
              page = 1
              while True:
                  params = {
                      "organization": sonar_org,
                      "componentKeys": project_key,
                      "statuses": "OPEN,CONFIRMED,REOPENED",
                      "ps": "500",
                      "p": str(page),
                  }
                  if query_branch:
                      params["branch"] = query_branch
                  params.update(extra_params)
                  url = f"{sonar_host}/api/issues/search?{urllib.parse.urlencode(params)}"
                  data = request_json(
                      "GET",
                      url,
                      headers={"Authorization": f"Bearer {sonar_token}"},
                  )
                  for issue in data.get("issues", []):
                      issues[issue["key"]] = issue
                  total = int(data.get("total", 0))
                  page_size = int(data.get("ps", 500))
                  if page * page_size >= total:
                      break
                  page += 1
              return issues

          def gh_api(method, path, data=None):
              url = f"https://api.github.com{path}"
              return request_json(
                  method,
                  url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  data=data,
              )

          def ensure_label(name, color):
              encoded = urllib.parse.quote(name, safe="")
              try:
                  gh_api("GET", f"/repos/{repository}/labels/{encoded}")
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise
                  gh_api("POST", f"/repos/{repository}/labels", {
                      "name": name,
                      "color": color,
                      "description": "Synced from SonarQube Cloud",
                  })

          def list_open_sonar_issues():
              result = {}
              page = 1
              while True:
                  params = urllib.parse.urlencode({
                      "state": "open",
                      "labels": "sonar",
                      "per_page": "100",
                      "page": str(page),
                  })
                  items = gh_api("GET", f"/repos/{repository}/issues?{params}")
                  if not items:
                      break
                  for item in items:
                      if "pull_request" in item:
                          continue
                      match = marker_re.search(item.get("body") or "")
                      if match:
                          result[match.group(1)] = item
                  page += 1
              return result

          def sonar_issue_url(key):
              query = urllib.parse.urlencode({"open": key, "id": project_key})
              return f"{sonar_host}/project/issues?{query}"

          def issue_labels(issue):
              labels = ["sonar"]
              severity = (issue.get("severity") or "").lower()
              issue_type = (issue.get("type") or "").lower()
              if severity in ("blocker", "critical"):
                  labels.append(f"sonar:{severity}")
              if issue_type == "vulnerability":
                  labels.append("sonar:vulnerability")
              return labels

          def issue_title(issue):
              severity = issue.get("severity") or "UNKNOWN"
              issue_type = issue.get("type") or "UNKNOWN"
              message = (issue.get("message") or issue.get("rule") or issue["key"]).replace("\n", " ")
              title = f"[Sonar][{severity}/{issue_type}] {message}"
              return title[:240]

          def issue_body(issue):
              component = issue.get("component", "")
              line = issue.get("line")
              location = f"{component}:{line}" if line else component
              fields = [
                  f"<!-- sonar-issue-key: {issue['key']} -->",
                  project_marker,
                  "",
                  f"Sonar issue: [{issue['key']}]({sonar_issue_url(issue['key'])})",
                  f"Project: `{project_key}`",
                  f"Branch: `{branch}`",
                  f"Severity: `{issue.get('severity', 'UNKNOWN')}`",
                  f"Type: `{issue.get('type', 'UNKNOWN')}`",
                  f"Rule: `{issue.get('rule', 'UNKNOWN')}`",
                  f"Location: `{location}`",
                  "",
                  "Message:",
                  issue.get("message", ""),
              ]
              return "\n".join(fields)

          blocker_or_critical = sonar_search({"severities": "BLOCKER,CRITICAL"})
          vulnerabilities = sonar_search({"types": "VULNERABILITY"})
          current = {**blocker_or_critical, **vulnerabilities}

          for name, color in label_specs.items():
              ensure_label(name, color)

          existing = list_open_sonar_issues()
          created = updated = closed = unchanged = 0

          for key, issue in sorted(current.items()):
              title = issue_title(issue)
              body = issue_body(issue)
              labels = issue_labels(issue)
              if key in existing:
                  gh_issue = existing[key]
                  current_labels = sorted(label["name"] for label in gh_issue.get("labels", []))
                  desired_labels = sorted(set(labels + [name for name in current_labels if not name.startswith("sonar")]))
                  if gh_issue.get("title") != title or (gh_issue.get("body") or "") != body or current_labels != desired_labels:
                      gh_api("PATCH", f"/repos/{repository}/issues/{gh_issue['number']}", {
                          "title": title,
                          "body": body,
                          "labels": desired_labels,
                      })
                      updated += 1
                  else:
                      unchanged += 1
              else:
                  gh_api("POST", f"/repos/{repository}/issues", {
                      "title": title,
                      "body": body,
                      "labels": labels,
                  })
                  created += 1

          for key, gh_issue in sorted(existing.items()):
              if key in current:
                  continue
              comment = f"SonarQube Cloud no longer reports `{key}` for project `{project_key}` on branch `{branch}`. Closing this synchronized issue."
              gh_api("POST", f"/repos/{repository}/issues/{gh_issue['number']}/comments", {"body": comment})
              gh_api("PATCH", f"/repos/{repository}/issues/{gh_issue['number']}", {"state": "closed"})
              closed += 1

          print(f"Sonar issue sync complete: created={created}, updated={updated}, unchanged={unchanged}, closed={closed}, current={len(current)}")
          PY
